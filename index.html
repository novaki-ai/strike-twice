<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1612" />
  <meta name="description" content="Novaki: Strike Twice - a 1930s rubber-hose cartoon action roguelite. Help a burnt-out matchstick relight a world gone dark." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Novaki: Strike Twice</title>
  <script>
    // assets use relative URLs: if the game folder was opened without its trailing slash, add it (once per tab,
    // so a host that strips slashes can't cause a reload loop)
    (function () {
      try {
        if (/\/$|\.html?$/i.test(location.pathname)) { sessionStorage.removeItem('novaki-slash'); return; }
        if (sessionStorage.getItem('novaki-slash')) return;
        sessionStorage.setItem('novaki-slash', '1');
        var u = new URL(location.href);
        u.pathname += '/';
        location.replace(u.href);
      } catch (e) { /* storage or URL unavailable: leave the page as is */ }
    })();
  </script>
  <link rel="icon" type="image/png" href="./assets/img/favicon.png" />
  <link rel="apple-touch-icon" href="./assets/img/apple-touch-icon.png" />
</head>
<body>
  <noscript><p style="color:#f3e6c4;font-family:sans-serif;text-align:center;margin-top:40vh">Novaki: Strike Twice needs JavaScript to strike a match.</p></noscript>
  <div id="game"></div>
  <div id="ui"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
